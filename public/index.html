<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMax 语音合成</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2129; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb; --error: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --text: #e6e8ec; --muted: #9aa1ad; --border: #2c313b; --accent: #5b8def; --error: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  textarea, input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 160px; resize: vertical; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #result { margin-top: 16px; }
  #result audio { width: 100%; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--error); white-space: pre-wrap; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>MiniMax 语音合成</h1>
  <p class="sub" id="providers">加载中…</p>

  <div class="card">
    <label for="text">文本</label>
    <textarea id="text" placeholder="输入要合成的文字">你好，欢迎使用 MiniMax 语音合成服务。</textarea>
    <div class="row"><span>支持 &lt;#0.5#&gt; 形式的停顿标记（单位：秒）</span><span id="count">0</span></div>

    <div class="grid">
      <div>
        <label for="model">模型</label>
        <select id="model">
          <option>speech-2.6-hd</option>
          <option>speech-2.6-turbo</option>
          <option>speech-02-hd</option>
          <option>speech-02-turbo</option>
          <option>speech-01-hd</option>
          <option>speech-01-turbo</option>
        </select>
      </div>
      <div>
        <label for="voice_id">音色 ID</label>
        <input id="voice_id" list="voices" value="male-qn-qingse">
        <datalist id="voices">
          <option value="male-qn-qingse">青涩青年</option>
          <option value="male-qn-jingying">精英青年</option>
          <option value="male-qn-badao">霸道青年</option>
          <option value="male-qn-daxuesheng">青年大学生</option>
          <option value="female-shaonv">少女</option>
          <option value="female-yujie">御姐</option>
          <option value="female-chengshu">成熟女性</option>
          <option value="female-tianmei">甜美女性</option>
          <option value="presenter_male">男性主持人</option>
          <option value="presenter_female">女性主持人</option>
          <option value="audiobook_male_1">男性有声书 1</option>
          <option value="audiobook_female_1">女性有声书 1</option>
        </datalist>
      </div>
      <div>
        <label for="emotion">情绪</label>
        <select id="emotion">
          <option value="">自动</option>
          <option value="happy">高兴</option>
          <option value="sad">悲伤</option>
          <option value="angry">愤怒</option>
          <option value="fearful">害怕</option>
          <option value="disgusted">厌恶</option>
          <option value="surprised">惊讶</option>
          <option value="calm">平静</option>
        </select>
      </div>
      <div>
        <label for="language_boost">语种增强</label>
        <select id="language_boost">
          <option value="auto">自动</option>
          <option value="Chinese">中文</option>
          <option value="Chinese,Yue">粤语</option>
          <option value="English">英语</option>
          <option value="Japanese">日语</option>
          <option value="Korean">韩语</option>
          <option value="">不设置</option>
        </select>
      </div>
      <div>
        <label for="speed">语速 <span id="speed_v">1.0</span></label>
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div>
        <label for="vol">音量 <span id="vol_v">1.0</span></label>
        <input id="vol" type="range" min="0.1" max="10" step="0.1" value="1">
      </div>
      <div>
        <label for="pitch">音调 <span id="pitch_v">0</span></label>
        <input id="pitch" type="range" min="-12" max="12" step="1" value="0">
      </div>
      <div>
        <label for="format">格式</label>
        <select id="format">
          <option>mp3</option>
          <option>wav</option>
          <option>flac</option>
        </select>
      </div>
      <div id="tokenBox" hidden>
        <label for="token">访问密码</label>
        <input id="token" type="password" autocomplete="current-password">
      </div>
    </div>

    <button id="go">生成语音</button>
    <div id="result"></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const LABELS = { intl: "国际站", cn: "国内站" };

  try { $("token").value = localStorage.getItem("tts_token") || ""; } catch {}

  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    $("providers").textContent = cfg.providers.length
      ? "调用顺序：" + cfg.providers.map((p) => LABELS[p] || p).join(" → ")
      : "服务端尚未配置 API Key";
    $("tokenBox").hidden = !cfg.requireToken;
    $("text").maxLength = cfg.maxTextLength;
  }).catch(() => { $("providers").textContent = "无法读取服务配置"; });

  const updateCount = () => { $("count").textContent = $("text").value.length + " 字"; };
  $("text").addEventListener("input", updateCount);
  updateCount();

  for (const id of ["speed", "vol", "pitch"]) {
    const sync = () => { $(id + "_v").textContent = $(id).value; };
    $(id).addEventListener("input", sync);
    sync();
  }

  let lastUrl = null;

  $("go").addEventListener("click", async () => {
    const body = {};
    for (const id of ["text", "model", "voice_id", "emotion", "language_boost", "speed", "vol", "pitch", "format"]) {
      body[id] = $(id).value;
    }
    const token = $("token").value;
    try { localStorage.setItem("tts_token", token); } catch {}

    $("go").disabled = true;
    $("go").textContent = "生成中…";
    $("result").innerHTML = "";
    try {
      const resp = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
        body: JSON.stringify(body),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ error: "HTTP " + resp.status }));
        throw new Error([err.error, ...(err.details || [])].join("\n"));
      }
      const blob = await resp.blob();
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = lastUrl;
      const link = document.createElement("a");
      link.href = lastUrl;
      link.download = "tts." + body.format;
      link.textContent = "下载音频";
      const meta = document.createElement("div");
      meta.className = "meta";
      const provider = resp.headers.get("X-TTS-Provider");
      const ms = Number(resp.headers.get("X-TTS-Audio-Length-Ms"));
      const chars = resp.headers.get("X-TTS-Usage-Characters");
      meta.append(
        `${LABELS[provider] || provider || ""}` +
        (ms ? ` · 时长 ${(ms / 1000).toFixed(1)} 秒` : "") +
        (chars ? ` · 计费 ${chars} 字符` : "") + " · ",
        link
      );
      $("result").append(audio, meta);
      audio.play().catch(() => {});
    } catch (e) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = e.message;
      $("result").append(div);
    } finally {
      $("go").disabled = false;
      $("go").textContent = "生成语音";
    }
  });
</script>
</body>
</html>
